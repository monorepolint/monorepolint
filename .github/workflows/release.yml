name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          # changesets/action v2 no longer writes an .npmrc from NPM_TOKEN.
          # setup-node writes one that reads the token from NODE_AUTH_TOKEN.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install

      - name: Create Release Pull Request
        uses: changesets/action@v2
        with:
          pr-title: "🦋 Changeset release"
          publish-script: pnpm ci:publish
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
